<div fxLayout="column" fxLayoutAlign="left start" 
                       fxLayoutGap="16px" 
                       class="ss-server-filters"
                       style="width:180px"
                      >
  <div fxFlex>
    <mat-card class="ss-server-filters-card">
      <mat-card-content>
          <mat-form-field style="width:120px">
              <input matInput type="text" 
                     placeholder="Filter by Name"
                    (keyup)="onNameFilterKeyUp($event)">
        </mat-form-field>
      </mat-card-content>
    </mat-card>
  </div>

  <div fxFlex *ngIf="dcFilterList && dcFilterList.length>1">
      <mat-card class="ss-server-filters-card">
        <mat-card-content>
            <mat-card-subtitle>Filter by Datacenter</mat-card-subtitle>
            <mat-selection-list (selectionChange)="onDCFilterChange($event)">
                <mat-list-option *ngFor="let dc of dcFilterList" 
                                checkboxPosition="before" 
                                [value]="dc">
                                {{dc}}
                </mat-list-option>
              </mat-selection-list>
        </mat-card-content>
      </mat-card>
   </div>
