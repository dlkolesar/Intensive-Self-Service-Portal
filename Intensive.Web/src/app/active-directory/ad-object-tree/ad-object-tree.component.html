
<div class="ss-ad-object-tree">
 <div *ngIf="pctComplete>0 && pctComplete<100" class="centered"
      style="padding-top:32px"
       >
    <p style="font-style: italic;font-size:8pt">Building Active Directory Tree....</p>
    <mat-spinner style="margin-left: auto; margin-right:auto" 
                color="accent">
    </mat-spinner>

  </div>
  <div *ngIf="pctComplete>=100" >
      <p style="padding-left:24px" *ngIf="showQuickSelect">
         Quick Select: <mat-button-toggle-group #group="matButtonToggleGroup" multiple >
                  <mat-button-toggle value="groups" 
                          [title]="showGroups ? 'De-select Groups' : 'Select Groups'"  
                          [checked]="showGroups" 
                          (change)="toggleGroups($event)">
                      <mat-icon>group</mat-icon>
                  </mat-button-toggle>
                  <mat-button-toggle value="Users" 
                          [title]="showUsers ? 'De-select Users' : 'Select Users'"  
                          [checked]="showUsers" 
                          (change)="toggleUsers($event)">
                      <mat-icon>person</mat-icon>
                  </mat-button-toggle>
                  <mat-button-toggle value="computers" 
                          [title]="showComputers ? 'De-select Computers' : 'Select Computers'"  
                          [checked]="showComputers" 
                          (change)="toggleComputers($event)">
                      <mat-icon>computer</mat-icon>
                  </mat-button-toggle>            
          </mat-button-toggle-group>
      </p> 
    <mat-tree [dataSource]="nestedDataSource" 
              [treeControl]="nestedTreeControl" 
              class="example-tree">

      <!-- leaf node -->
      <mat-tree-node *matTreeNodeDef="let node;" matTreeNodeToggle
            matTreeNodePaddingIndent="8px">
        <li class="mat-tree-node">
          <button mat-icon-button disabled></button>
         
          <mat-checkbox *ngIf="multiple"
                      class="checklist-leaf-node"
                      [checked]="checklistSelection.isSelected(node)"
                      (change)="toggle(node);">
              <mat-icon *ngIf="node.item.isComputer()">computer</mat-icon>
              <mat-icon *ngIf="node.item.isUser()">person</mat-icon>
              <mat-icon *ngIf="node.item.isGroup()">group</mat-icon>
              {{node.item.displayName}}
          </mat-checkbox>
          <span *ngIf="!multiple">
              <mat-icon *ngIf="node.item.isComputer()">computer</mat-icon>
              <mat-icon *ngIf="node.item.isUser()">person</mat-icon>
              <mat-icon *ngIf="node.item.isGroup()">group</mat-icon>
              {{node.item.displayName}}
          </span>
        </li>
      </mat-tree-node>
    
      <!-- non-leaf node -->
      <mat-nested-tree-node *matTreeNodeDef="let node; when: hasNestedChild" 
                            matTreeNodePaddingIndent="8px">
        <li>
          <div class="mat-tree-node">
            <button mat-icon-button matTreeNodeToggle
                    [attr.aria-label]="'toggle ' + node.item.displayName">
              <mat-icon class="mat-icon-rtl-mirror">
                {{nestedTreeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
              </mat-icon>
            </button>
            
            <mat-checkbox *ngIf="multiple"
                    [checked]="descendantsAllSelected(node)"
                    [indeterminate]="descendantsPartiallySelected(node)"
                    (change)="toggle(node)">
              {{node.item.displayName}}
          </mat-checkbox>

          <span *ngIf="!multiple">
            {{node.item.displayName}}
          </span>

          </div>
          <ul [class.example-tree-invisible]="!nestedTreeControl.isExpanded(node)">
            <ng-container matTreeNodeOutlet></ng-container>
          </ul>
        </li>
      </mat-nested-tree-node>
    </mat-tree>
  </div>
</div>
  <!---
  icons:  
    domain====> widgets
    container=> picture_in_picture list_alt
    user======> person person_add
    computer==> computer
    group=====> group group_add
  -->
