
<div mat-dialog class="ss-ad-migration-options-dialog">
  <form #optionsForm="ngForm">
    <h1 mat-dialog-title>Migration Options</h1>
    <mat-dialog-content>
     <div *ngIf="showGroupOptions"> [Group Options] </div>
     <div *ngIf="showUserOptions"> [User Options] </div>
     <div *ngIf="showComputerOptions"> [Computer Options] </div>
    </mat-dialog-content>
    <mat-dialog-actions style="float:right">
      <button mat-button  color="accent" 
                mat-dialog-close 
                (click)="close">Cancel</button>
      <button type="submit" mat-raised-button  color="primary" 
              [mat-dialog-close]="options">Migrate</button>
    </mat-dialog-actions>
  </form>
</div>
